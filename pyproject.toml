[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rde-eval-scaffold"
version = "0.1.0"
description = "Experimental scaffold for evaluating Resonant Deviation Evaluator labels."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "Tomoyuki Kano", email = "tomyuk@zyxcorp.jp" }
]
keywords = ["rde", "llm-evaluation", "meaning-drift", "ai-auditing"]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4"
]
# Heavy (torch). Used by optional BERTScore baselines — see docs/milestone3_baseline_plan.md
baseline = [
  "bert-score>=0.3.13",
]
# NLI baseline stack — transformers pulls torch-like deps as needed (see Milestone 3 Phase 3)
baseline-nli = [
  "transformers>=4.40.0",
]

[tool.setuptools.packages.find]
include = ["rde_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
